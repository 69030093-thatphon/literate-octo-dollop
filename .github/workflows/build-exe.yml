name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ต้องใช้ตอนสร้าง Release จาก tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python test_service.py

      - name: Build backend exe
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --name fisch_backend
          --collect-submodules uvicorn
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          main.py

      - name: Build app exe
        run: pyinstaller --noconfirm --onefile --windowed --name fisch_macro fisch_macro.py

      - name: Build database viewer exe
        run: pyinstaller --noconfirm --onefile --windowed --name view_database view_database.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item settings.example.json dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath fisch-macro-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fisch-macro-windows
          path: fisch-macro-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fisch-macro-windows.zip
